<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Prevent extension / interceptor errors when assigning to window.fetch
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : function() {
            return Promise.reject(new Error('Fetch not available'));
          };
          var currentFetch = originalFetch;

          var descriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = typeof fn === 'function' ? fn : originalFetch;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              } catch (e2) {}
            }
          }
        } catch (e) {}

        // Suppress any remaining uncaught TypeError from extensions attempting to patch read-only fetch
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            event.message.indexOf('Cannot set property fetch of') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
